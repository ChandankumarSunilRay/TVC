name: Test and deploy EC2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""
      - name: Package tested release (no credentials or uploaded files)
        run: |
          tar -czf release.tar.gz frontend/dist server/package.json server/package-lock.json server/index.js server/controllers server/database server/middlewares server/models server/routes server/utils
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 7

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: ec2-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Show OIDC identity claims (no token or credentials)
        shell: bash
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request
          role = os.environ.get('DEPLOY_ROLE_ARN', '').strip()
          if role != 'arn:aws:iam::926465100191:role/github-elearning-deploy':
              raise SystemExit('AWS_DEPLOY_ROLE_ARN must identify the github-elearning-deploy role in account 926465100191. Check repository AND production environment variables.')
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          url += ('&' if '?' in url else '?') + urllib.parse.urlencode({'audience': 'sts.amazonaws.com'})
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          # Decode for diagnosis only. AWS verifies the signature during authentication.
          print(json.dumps({key: claims.get(key) for key in
              ('iss', 'aud', 'sub', 'repository', 'ref', 'environment')}, indent=2))
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload release and request deployment
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_BUCKET" =~ ^[a-z0-9][a-z0-9.-]+$ ]]
          [[ "$EC2_INSTANCE_ID" =~ ^i-[a-f0-9]+$ ]]
          aws s3 cp release.tar.gz "s3://$DEPLOY_BUCKET/releases/$RELEASE_ID.tar.gz" --only-show-errors
          python3 - <<'PY'
          import json, os, shlex
          command = shlex.join(['/usr/local/sbin/deploy-elearning', os.environ['RELEASE_ID'], os.environ['DEPLOY_BUCKET'], os.environ['AWS_REGION']])
          with open('parameters.json', 'w') as output:
              json.dump({'commands': [command], 'executionTimeout': ['900']}, output)
          PY
          command_id=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --document-name AWS-RunShellScript --parameters file://parameters.json --timeout-seconds 120 --query 'Command.CommandId' --output text)
          # Poll beyond the short default CLI waiter; fail on every terminal error.
          for attempt in $(seq 1 100); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) echo 'Deployment and health check passed'; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) echo "Deployment failed: $status. Inspect Systems Manager command $command_id"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Deployment result timed out. Inspect Systems Manager command $command_id before retrying."
          exit 1
